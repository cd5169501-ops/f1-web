# Manda un aviso por ntfy antes de cada sesion de F1.
# Corre cada 5 minutos; GitHub puede demorarlo unos minutos mas en horas pico.

name: Avisos de sesiones

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de anticipacion"
        required: false
        default: "60"
      dry_run:
        description: "Solo mostrar los avisos, sin enviar"
        type: boolean
        default: false

# Necesario para poder commitear data/avisos_enviados.json.
permissions:
  contents: write

# Evita que dos ejecuciones se pisen al escribir el registro.
concurrency:
  group: avisos-f1
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar avisos
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          MINUTOS_ANTICIPACION: ${{ inputs.minutos || vars.MINUTOS_ANTICIPACION || '60' }}
          URL_WEB: ${{ vars.URL_WEB }}
        run: python scripts/avisos.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Guardar registro de avisos
        # Se ejecuta tambien si el paso anterior fallo, para no perder lo enviado.
        if: always()
        run: |
          if git diff --quiet -- data/avisos_enviados.json; then
            echo "Sin cambios en el registro."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/avisos_enviados.json
          git commit -m "chore(avisos): registrar avisos enviados"
          git push
